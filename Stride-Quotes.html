<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Daily Quotes</title>

<!-- Makes it installable & full-screen on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quotes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#667eea" />

<!-- App icon (used on the home screen) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23667eea'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Georgia'%3E%22%3C/text%3E%3C/svg%3E" />

<!-- Inline manifest so this works as a single file -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Daily%20Quotes%22%2C%22short_name%22%3A%22Quotes%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23667eea%22%2C%22theme_color%22%3A%22%23667eea%22%7D" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: background 1.2s ease;
    overflow: hidden;
    position: relative;
  }
  .orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .orb1 { top: -10%; left: -10%; width: 50%; height: 50%; background: rgba(255,255,255,0.18); filter: blur(80px); }
  .orb2 { bottom: -15%; right: -10%; width: 55%; height: 55%; background: rgba(255,255,255,0.12); filter: blur(90px); }

  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }

  .card {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 320px;
    justify-content: space-between;
  }

  .icon-badge {
    width: 52px; height: 52px; border-radius: 16px;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    font-size: 22px; color: #fff;
  }

  .content {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    gap: 18px; opacity: 1; transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .content.fading { opacity: 0; transform: translateY(8px); }

  .quote-text {
    font-size: 21px; line-height: 1.45; font-weight: 600; color: #fff;
    letter-spacing: -0.01em; text-shadow: 0 1px 12px rgba(0,0,0,0.12);
  }
  .quote-author { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.85); }

  .actions { display: flex; align-items: center; gap: 12px; margin-top: 28px; width: 100%; }

  .like-btn {
    width: 52px; height: 52px; border-radius: 16px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; font-size: 20px;
  }
  .like-btn.liked { background: rgba(255,90,110,0.35); }
  .like-btn:active { transform: scale(0.92); }

  .next-btn {
    flex: 1; height: 52px; border-radius: 16px;
    background: rgba(255,255,255,0.95); border: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; font-size: 16px; font-weight: 600; color: #1a1a2e;
    letter-spacing: -0.01em; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
  }
  .next-btn:active { transform: scale(0.97); }

  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.35); transition: all 0.3s ease; }
  .dot.active { width: 18px; background: rgba(255,255,255,0.9); }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="wrap">
    <div class="card">
      <div class="icon-badge">&#8220;</div>

      <div class="content" id="content">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-author" id="quoteAuthor"></div>
      </div>

      <div class="actions">
        <button class="like-btn" id="likeBtn" aria-label="Like quote">&#9825;</button>
        <button class="next-btn" id="nextBtn">&#8635; New Quote</button>
      </div>
    </div>

    <div class="dots" id="dots"></div>
  </div>

<script>
  const QUOTES = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
    { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Don't let yesterday take up too much of today.", author: "Will Rogers" },
    { text: "You learn more from failure than from success.", author: "Unknown" },
    { text: "If you are working on something exciting, it will keep you motivated.", author: "Steve Jobs" },
    { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Do not wait to strike till the iron is hot, but make it hot by striking.", author: "William Butler Yeats" },
    { text: "Quality is not an act, it is a habit.", author: "Aristotle" },
    { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
    { text: "Certain things catch your eye, but pursue only those that capture the heart.", author: "Ancient Indian Proverb" }
  ];

  const GRADIENTS = [
    "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
    "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
    "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
    "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
    "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
    "linear-gradient(135deg, #30cfd0 0%, #330867 100%)",
    "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)",
    "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)"
  ];

  let index = Math.floor(Math.random() * QUOTES.length);
  let bg = 0;
  const liked = {};

  const contentEl = document.getElementById('content');
  const textEl = document.getElementById('quoteText');
  const authorEl = document.getElementById('quoteAuthor');
  const likeBtn = document.getElementById('likeBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsEl = document.getElementById('dots');

  function render() {
    const q = QUOTES[index];
    textEl.textContent = '"' + q.text + '"';
    authorEl.textContent = '— ' + q.author;
    likeBtn.classList.toggle('liked', !!liked[index]);
    likeBtn.innerHTML = liked[index] ? '&#9829;' : '&#9825;';
    document.body.style.background = GRADIENTS[bg];

    dotsEl.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === index % 5 ? ' active' : '');
      dotsEl.appendChild(d);
    }
  }

  function getRandomIndex(exclude) {
    if (QUOTES.length === 1) return 0;
    let i = Math.floor(Math.random() * QUOTES.length);
    while (i === exclude) i = Math.floor(Math.random() * QUOTES.length);
    return i;
  }

  nextBtn.addEventListener('click', () => {
    contentEl.classList.add('fading');
    setTimeout(() => {
      index = getRandomIndex(index);
      bg = (bg + 1) % GRADIENTS.length;
      render();
      contentEl.classList.remove('fading');
    }, 220);
  });

  likeBtn.addEventListener('click', () => {
    liked[index] = !liked[index];
    render();
  });

  render();
</script>
</body>
</html>
